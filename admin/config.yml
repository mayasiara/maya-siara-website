
backend:
  name: turbo-github
  turbo_site_id: 33b6616f-d47c-4179-a3bc-e727cc91e067
  branch: main

media_folder: "uploads"
public_folder: "/maya-siara-website/uploads"

collections:

  # 1. COMPANY PROFILE
  - name: "company"
    label: "1. Company Profile"
    files:
      - name: "company_info"
        label: "Company Information"
        file: "content/settings/company.yml"
        format: "yaml"
        fields:
          - label: "Company Name"
            name: "company_name"
            widget: "string"
          - label: "Company Subline"
            name: "company_subline"
            widget: "string"
            required: false
          - label: "Legal Company Name"
            name: "legal_name"
            widget: "string"
            required: false
          - label: "Footer Tagline"
            name: "footer_tagline"
            widget: "string"
            required: false
          - label: "Footer Copyright Text"
            name: "copyright_text"
            widget: "string"
            required: false
          - label: "Contact Section Small Heading"
            name: "contact_eyebrow"
            widget: "string"
            required: false
          - label: "Contact Section Main Heading"
            name: "contact_title"
            widget: "text"
            required: false
          - label: "Contact Section Introduction"
            name: "contact_intro"
            widget: "text"
            required: false
          - label: "Phone Label"
            name: "phone_label"
            widget: "string"
            required: false
            default: "Phone"
          - label: "Email Label"
            name: "email_label"
            widget: "string"
            required: false
            default: "Email"
          - label: "WhatsApp Label"
            name: "whatsapp_label"
            widget: "string"
            required: false
            default: "WhatsApp"
          - label: "Office Address Label"
            name: "address_label"
            widget: "string"
            required: false
            default: "Office"
          - label: "Facebook Link Label"
            name: "facebook_label"
            widget: "string"
            required: false
            default: "Visit Facebook"
          - label: "Instagram Link Label"
            name: "instagram_label"
            widget: "string"
            required: false
            default: "Visit Instagram"
          - label: "Company Logo"
            name: "logo"
            widget: "image"
            required: false
          - label: "Tagline"
            name: "tagline"
            widget: "string"
            required: false
          - label: "Phone"
            name: "phone"
            widget: "string"
            required: false
          - label: "Email"
            name: "email"
            widget: "string"
            required: false
          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false
          - label: "Office Address"
            name: "address"
            widget: "text"
            required: false
          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

  # 2. HOMEPAGE
  - name: "homepage"
    label: "2. Homepage"
    files:
      - name: "home_content"
        label: "Homepage Content"
        file: "content/settings/homepage.yml"
        format: "yaml"
        fields:
          - label: "Small Heading (Hero)"
            name: "eyebrow"
            widget: "string"
            required: false
          - label: "Main Heading (use a new line where needed)"
            name: "title"
            widget: "text"
            required: false
          - label: "Introduction"
            name: "description"
            widget: "text"
            required: false
          - label: "Hero Image Caption"
            name: "image_caption"
            widget: "string"
            required: false
          - label: "Projects Small Heading"
            name: "projects_eyebrow"
            widget: "string"
            required: false
          - label: "Projects Section Title"
            name: "projects_title"
            widget: "string"
            required: false
          - label: "Projects Section Introduction"
            name: "projects_intro"
            widget: "text"
            required: false
          - label: "Gallery Small Heading"
            name: "gallery_eyebrow"
            widget: "string"
            required: false
          - label: "Gallery Section Title"
            name: "gallery_title"
            widget: "string"
            required: false
          - label: "Gallery Section Introduction"
            name: "gallery_intro"
            widget: "text"
            required: false
          - label: "Show Projects Section"
            name: "show_projects"
            widget: "boolean"
            default: true
          - label: "Show Gallery Section"
            name: "show_gallery"
            widget: "boolean"
            default: true
          - label: "Navigation - Home"
            name: "navigation.home_label"
            widget: "string"
            default: "Home"
          - label: "Navigation - About Us"
            name: "navigation.about_label"
            widget: "string"
            default: "About Us"
          - label: "Navigation - Projects"
            name: "navigation.projects_label"
            widget: "string"
            default: "Projects"
          - label: "Navigation - Gallery"
            name: "navigation.gallery_label"
            widget: "string"
            default: "Gallery"
          - label: "Navigation - Contact"
            name: "navigation.contact_label"
            widget: "string"
            default: "Contact"
          - label: "Main Button Text"
            name: "button_text"
            widget: "string"
            required: false
          - label: "Main Button Link"
            name: "button_link"
            widget: "string"
            required: false
          - label: "Main Image"
            name: "hero_image"
            widget: "image"
            required: false

  # 3. ABOUT US
  - name: "about"
    label: "3. About Us"
    files:
      - name: "about_content"
        label: "About Us Content"
        file: "content/settings/about.yml"
        format: "yaml"
        fields:
          - label: "Small Heading"
            name: "eyebrow"
            widget: "string"
          - label: "Main Heading"
            name: "title"
            widget: "text"
            required: false
          - label: "Company Introduction"
            name: "paragraphs"
            widget: "list"
            required: false
            field:
              label: "Paragraph"
              name: "paragraph"
              widget: "text"
          - label: "About Image"
            name: "image"
            widget: "image"
            required: false

  # 4. TYPOGRAPHY
  - name: "typography"
    label: "4. Typography & Fonts"
    files:
      - name: "font_settings"
        label: "Website Font Settings"
        file: "content/settings/typography.yml"
        format: "yaml"
        fields:
          - label: "Main Font"
            name: "main_font"
            widget: "select"
            options:
              - "Arial"
              - "Roboto"
              - "Open Sans"
              - "Lato"
              - "Montserrat"
              - "Poppins"
              - "Inter"
              - "Playfair Display"
              - "Cormorant Garamond"
              - "DM Sans"
          - label: "Heading Font"
            name: "heading_font"
            widget: "select"
            options:
              - "Arial"
              - "Roboto"
              - "Montserrat"
              - "Poppins"
              - "Inter"
              - "Playfair Display"
              - "Cormorant Garamond"
              - "DM Sans"
          - label: "Body Font Size"
            name: "body_size"
            widget: "number"
            value_type: "int"
            default: 14
            min: 10
            max: 24
          - label: "Heading Font Size"
            name: "heading_size"
            widget: "number"
            value_type: "int"
            default: 48
            min: 20
            max: 100
          - label: "Font Weight"
            name: "font_weight"
            widget: "select"
            options:
              - "300"
              - "400"
              - "500"
              - "600"
              - "700"

  # 5. COLORS & DESIGN
  - name: "design"
    label: "5. Colors & Design"
    files:
      - name: "design_settings"
        label: "Website Design Settings"
        file: "content/settings/design.yml"
        format: "yaml"
        fields:
          - label: "Background Color"
            name: "background_color"
            widget: "color"
            default: "#F7F5EF"
          - label: "Main Text Color"
            name: "text_color"
            widget: "color"
            default: "#252520"
          - label: "Accent Color"
            name: "accent_color"
            widget: "color"
            default: "#B89B70"
          - label: "Secondary Background"
            name: "secondary_color"
            widget: "color"
            default: "#EAE7DF"
          - label: "Button Background"
            name: "button_color"
            widget: "color"
            default: "#252520"
          - label: "Button Text Color"
            name: "button_text_color"
            widget: "color"
            default: "#FFFFFF"

  # 6. GALLERY
  - name: "gallery"
    label: "6. Website Gallery"
    files:
      - name: "gallery_images"
        label: "Gallery Images"
        file: "content/settings/gallery.yml"
        format: "yaml"
        fields:
          - label: "Gallery Images"
            name: "images"
            widget: "list"
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Image Description"
                name: "alt"
                widget: "string"
                required: false


  # 7. IMAGE SIZE & LAYOUT
  - name: "image_layout"
    label: "7. Image Size & Layout"
    files:
      - name: "image_layout_settings"
        label: "Website Image Layout"
        file: "content/settings/image-layout.yml"
        format: "yaml"
        fields:
          - label: "Property Main Photo Height (px)"
            name: "property_image_height"
            widget: "number"
            value_type: "int"
            default: 420
            min: 250
            max: 700
          - label: "Property Photo Fit"
            name: "image_fit"
            widget: "select"
            options:
              - "cover"
              - "contain"
            default: "cover"
          - label: "Hero Image Height (px)"
            name: "hero_height"
            widget: "number"
            value_type: "int"
            default: 470
            min: 200
            max: 800
          - label: "Gallery Image Height (px)"
            name: "gallery_image_height"
            widget: "number"
            value_type: "int"
            default: 230
            min: 100
            max: 600

  # 8. PROPERTY PROJECTS
  - name: "projects"
    label: "7. Property Projects"
    label_singular: "Property"
    folder: "content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - label: "Project Name"
        name: "project_name"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Project Status"
        name: "project_status"
        widget: "select"
        options:
          - "For Sale"
          - "For Rent"
          - "Sold"
          - "Rented"
          - "Ongoing"
          - "Completed"

      - label: "Property Type"
        name: "property_type"
        widget: "select"
        options:
          - "Residential"
          - "Commercial"
          - "Industrial"
          - "Land"
          - "Agriculture"
          - "Mixed Development"
          - "New Development"
          - "Other"

      - label: "Price"
        name: "price"
        widget: "string"
        required: false

      - label: "Bedrooms"
        name: "bedrooms"
        widget: "number"
        required: false
        value_type: "int"
        min: 0

      - label: "Bathrooms"
        name: "bathrooms"
        widget: "number"
        required: false
        value_type: "int"
        min: 0

      - label: "Built-up Area"
        name: "built_up_area"
        widget: "string"
        required: false

      - label: "Land Area"
        name: "land_area"
        widget: "string"
        required: false

      - label: "Tenure"
        name: "tenure"
        widget: "string"
        required: false

      - label: "Description"
        name: "description"
        widget: "markdown"
        required: false

      - label: "Main Project Image"
        name: "main_project_image"
        widget: "image"
        required: false

      - label: "Project Gallery"
        name: "project_gallery"
        widget: "list"
        required: false
        fields:
          - label: "Image"
            name: "image"
            widget: "image"

      - label: "Featured Property"
        name: "featured"
        widget: "boolean"
        required: false
        default: false
